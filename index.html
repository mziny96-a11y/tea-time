<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<link rel="icon" id="favicon">
<title>Tea Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#141414;--muted:#7d756c;--line:#ebe3d9;--accent:#b85e00;--accent-2:#f39200;--ok:#2f7d4f;--warn:#c27a00;--danger:#b3261e;--r:14px;--shadow:0 1px 2px rgba(42,28,18,.06),0 4px 14px rgba(42,28,18,.06)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h2,h3{margin:0 0 6px}
.muted{color:var(--muted)}.center{text-align:center}.err{color:var(--danger);min-height:1em;margin:6px 0}.sm{font-size:13px}.okt{color:var(--ok);font-weight:700}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--ink);color:#fff;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:17px;line-height:1.2}.brand small{opacity:.75;font-size:13px}
.logo{width:42px;height:42px;object-fit:contain;display:block}
.hero-logo{display:block;width:150px;max-width:50%;margin:0 auto 10px}
.menu-logo{display:block;width:110px;margin:4px auto 12px}
.qr-logo{display:block;width:120px;margin:0 auto}
.topbar{border-bottom:3px solid var(--accent-2)}
.topbar .logo{background:#fff;border-radius:11px;padding:3px;width:46px;height:46px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:720px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--line);transition:transform .08s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.topbar .btn.ghost{border-color:rgba(255,255,255,.3);color:#fff}.topbar .btn.ghost.on{background:#fff;color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px}.btn.block{width:100%}
.danger-t{color:var(--danger)!important}
.icon{border:0;background:var(--line);width:36px;height:36px;border-radius:50%;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.narrow{max-width:440px;margin:24px auto}
label{display:block;font-weight:600;font-size:14px;margin:10px 0}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-2);border-color:transparent}
.empty{text-align:center;padding:48px 16px}.empty .big{font-size:52px}
.demo-banner{background:#fff1d6;color:#7a5200;padding:8px 16px;font-size:13.5px;text-align:center}
.conn-err{background:var(--danger);color:#fff;text-align:center;padding:8px;font-weight:700}
.info-box{background:#fdf6ec;border:1px solid #f0dcc2;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.warn-box{background:#fff1d6;border:1px solid #f2d28c;border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0;color:#6b4700}
/* customer */
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none;scroll-behavior:smooth}.cats::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat-title{margin:14px 2px 8px;font-size:18px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:var(--r);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.item-main{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.ico{width:48px;height:48px;border-radius:14px;background:#fff4e6;display:grid;place-items:center;font-size:25px;flex:0 0 48px}
.sugar-hint{display:block;font-size:12px;color:var(--accent);font-weight:700}
.menu-top{position:sticky;top:var(--topH,70px);z-index:6;background:var(--bg);margin:-16px -16px 6px;padding:10px 16px 0;box-shadow:0 6px 10px -8px rgba(0,0,0,.15)}
.search{position:relative}
.search input{margin:0;border-radius:99px;padding:11px 44px 11px 16px;background:#fff;border:1.5px solid var(--line)}
.search .s-ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;pointer-events:none}
.search button{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:#eee;border-radius:50%;width:28px;height:28px;cursor:pointer}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.cat-tile{background:#fff;border:0;border-radius:14px;padding:12px 4px 10px;box-shadow:var(--shadow);text-align:center;cursor:pointer;font-weight:800;font-size:13px;line-height:1.3}
.cat-tile .e{font-size:30px;display:block;margin-bottom:4px}.cat-tile small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.cat-sec{scroll-margin-top:calc(var(--topH,70px) + 108px)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.opt-btn{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;font-weight:800;font-size:18px;cursor:pointer;color:var(--ink)}
.opt-btn .cubes{display:flex;justify-content:center;gap:4px;min-height:18px;margin-bottom:4px}
.opt-btn .cubes i{width:13px;height:13px;border-radius:3px;background:#fff;border:2px solid var(--accent-2);display:block}
.opt-btn .cubes em{color:var(--muted);font-style:normal;line-height:14px}
.opt-btn small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.opt-btn:active,.opt-btn:hover{border-color:var(--accent-2);background:#fff4e6}
.opt-lbl{display:inline-block;background:#fff1c9;color:#7a5200;border-radius:99px;padding:0 8px;font-size:12px;font-weight:800;margin-inline-start:4px}
.hello{background:#fff;border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:14px;box-shadow:var(--shadow)}
.hello a{font-weight:700}
.no-res{text-align:center;padding:30px 10px;color:var(--muted)}
.item-info b{display:block}.item-info small{display:block;color:var(--muted);font-size:13px}
.price{color:var(--accent);font-weight:700;font-size:15px;white-space:nowrap}
.btn.add{background:#f3e8dc;color:var(--accent);white-space:nowrap}
.qty{display:flex;align-items:center;gap:10px;background:#f3e8dc;border-radius:99px;padding:4px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:18px;font-weight:700;cursor:pointer;line-height:1}
.qty b{min-width:18px;text-align:center}
.spacer{height:90px}
.cartbar{position:fixed;inset:auto 0 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:15}
.cartbar .btn{width:100%;max-width:688px;margin:0 auto;display:flex;justify-content:space-between;padding:14px 18px;font-size:16px;box-shadow:0 6px 20px rgba(122,74,36,.35)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-line small{display:block;color:var(--muted)}
.line-total{font-weight:700;min-width:70px;text-align:left}
.sum-row{display:flex;justify-content:space-between;font-size:18px;margin:8px 0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.bill-head{display:flex;justify-content:space-between;align-items:center}
.bill-total{text-align:left}.bill-total b{display:block;font-size:26px;color:var(--accent)}
.order-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.line{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.line.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.note{background:#fdf6ec;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.paid-box{background:#e9f5ee;color:var(--ok);font-weight:700;text-align:center}
.paid-box .btn{margin-top:10px}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.s-new{background:#fff1d6;color:#8a5a00}.s-prep{background:#e3eefc;color:#1d4f91}.s-served{background:#e9f5ee;color:var(--ok)}.s-paid{background:#ece7e2;color:var(--muted)}.s-cancel{background:#fbe4e2;color:var(--danger)}
/* cashier */
body.cashier main{max-width:1400px}
.tabs{display:flex;gap:6px;padding:10px 16px 0;max-width:1400px;margin:0 auto;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.count:not(:empty){background:var(--danger);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-inline-start:4px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.col{background:#efe6dc;border-radius:var(--r);padding:10px;min-height:200px}
.col>h3{display:flex;justify-content:space-between;padding:4px 6px 10px;font-size:16px}
.ocard{margin-bottom:10px;border-inline-start:5px solid var(--line)}
.col-new .ocard{border-inline-start-color:var(--warn)}.col-preparing .ocard{border-inline-start-color:#2d6cc0}.col-served .ocard{border-inline-start-color:var(--ok)}
.ocard.flash{animation:flash 1s ease-in-out 8}
@keyframes flash{50%{background:#fff1c9;box-shadow:0 0 0 4px var(--warn)}}
.cust{font-size:14px;color:var(--muted);margin-bottom:6px}
.items{list-style:none;padding:0;margin:6px 0}.items li{padding:3px 0;border-bottom:1px dotted var(--line)}
.order-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.big-total{font-size:22px;color:var(--accent)}
.warn-t{color:var(--warn);font-size:13px;font-weight:700;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);display:block}.stat b{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.mrow{display:grid;grid-template-columns:1fr auto auto auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow.off b{text-decoration:line-through;color:var(--muted)}
.switch{position:relative;width:44px;height:24px;margin:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#d9cbbd;border-radius:99px;cursor:pointer;transition:.2s}
.switch span:before{content:"";position:absolute;width:18px;height:18px;top:3px;right:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span:before{transform:translateX(-20px)}
.chk{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:#fff}.chk input{width:auto;margin:0}
.voice-sel{width:auto;display:inline-block;margin:0;padding:6px 10px;font-size:14px;background:#222;color:#fff;border-color:#444}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.qr-card{background:#fff;border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;break-inside:avoid;page-break-inside:avoid}
.qr-card .qr-code{display:flex;justify-content:center;margin:10px 0}
.qr-cafe{display:block;font-size:16px}.qr-t{display:block;font-size:22px;color:var(--accent)}
.qr-card small{color:var(--muted)}
.steps{counter-reset:s;padding:0;list-style:none;margin:10px 0}
.steps>li{counter-increment:s;position:relative;padding:4px 36px 10px 0}
.steps>li:before{content:counter(s);position:absolute;right:0;top:4px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.code-box{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:170px;white-space:pre;background:#fbf8f4}
.auth-tabs{display:flex;gap:6px;margin:10px 0;background:#f3e8dc;padding:4px;border-radius:10px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.auth-tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.staff-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.staff-row select{width:auto;margin:0;padding:6px 10px;font-size:14px}
.role-tag{background:rgba(255,255,255,.18);border-radius:99px;padding:0 8px;margin-inline-start:4px}
.rep-periods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.rep-sort{width:auto;margin:0;padding:7px 10px;font-size:14px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.bar-track{background:#f3ece4;border-radius:6px;height:14px;overflow:hidden}.bar-fill{background:var(--accent-2);height:100%;border-radius:6px}
.bar-row b{white-space:nowrap}
.ctable td.num{font-variant-numeric:tabular-nums}
.pct{display:inline-block;min-width:44px}
.print-only{display:none}
@media print{.print-only{display:block}.tabs,.topbar,#repPeriods{display:none!important}}
.promo{background:#141414;color:#fff;border-inline-start:6px solid var(--accent-2);border-radius:var(--r);padding:12px 14px;margin:4px 0 12px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.promo .big{font-size:24px;line-height:1}
.sec-title{margin:16px 2px 8px;font-size:18px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll .item{flex:0 0 215px;flex-direction:column;align-items:stretch;justify-content:space-between;scroll-snap-align:start;margin:0;gap:10px}
.hscroll .item-main{align-items:flex-start}
.hscroll .item>.btn,.hscroll .item>.qty{align-self:flex-start}
.item.offer{background:linear-gradient(180deg,#fff4e6,#fff);border:1px solid #f0d7b5}
.old{color:var(--muted);text-decoration:line-through;font-size:13px;font-weight:600;margin-inline-start:6px}
.tags{margin:2px 0}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;margin-inline-end:4px}
.tag.hot{background:#fde3dc;color:#b3261e}.tag.star{background:#fff1c9;color:#8a5a00}
.star-btn{border:0;background:transparent;font-size:20px;cursor:pointer;opacity:.25;filter:grayscale(1);padding:0 4px}.star-btn.on{opacity:1;filter:none}
.chk-inline{display:flex;align-items:center;gap:8px;margin:12px 0}.chk-inline input{width:auto;margin:0}
.disc-line{color:var(--ok)}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable th{text-align:right;color:var(--muted);font-weight:700;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
.ctable td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctable tr[data-p]{cursor:pointer}.ctable tr[data-p]:hover{background:#faf6f0}
.wa{color:#1f9d55;font-weight:700;text-decoration:none;margin-inline-start:6px}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.mini-stats div{background:#f6f1ea;border-radius:10px;padding:8px 10px}.mini-stats small{display:block;color:var(--muted);font-size:12px}.mini-stats b{font-size:16px}
.hist{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
#custModal .sheet{max-width:760px}
@media (max-width:900px){.board{grid-template-columns:1fr}}
@media (max-width:560px){.mrow{grid-template-columns:1fr auto auto}.mrow .price{grid-column:1}}
@media print{body{background:#fff}.no-print{display:none!important}main{padding:0}.qr-grid{grid-template-columns:repeat(3,1fr);gap:8px}.qr-card{border:1.5px dashed #999}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<template id="tpl-opt">
  <div class="sheet-bg" id="optSheet" hidden>
    <div class="sheet">
      <div class="sheet-head"><h3 id="optTitle"></h3><button class="icon" id="optClose" aria-label="إغلاق">✕</button></div>
      <p class="muted" style="margin:0">تحب السكر إيه؟</p>
      <div class="opt-grid" id="optGrid"></div>
    </div>
  </div>
</template>

<!-- ======================= صفحة الزبون ======================= -->
<template id="tpl-customer">
  <header class="topbar">
    <div class="brand"><img class="logo" data-logo="badge" alt=""><div><b class="cafeName"></b><small>ترابيزة <span class="tableNo"></span></small></div></div>
    <nav class="top-actions" id="topActions" hidden>
      <button class="btn ghost sm" id="goMenu">المنيو</button>
      <button class="btn ghost sm" id="goBill">🧾 حسابي</button>
    </nav>
  </header>
  <div class="demo-banner" id="demoBanner" hidden>وضع تجريبي — الطلبات مش هتوصل للكاشير من جهاز تاني</div>
  <main>
    <section id="scr-noTable" class="screen" hidden>
      <div class="empty"><img class="hero-logo" data-logo="full" alt="Tea Time"><h2>امسح الكود اللي على الترابيزة</h2><p class="muted">الرابط ده محتاج رقم ترابيزة عشان نعرف نوصّلك الطلب.</p></div>
    </section>
    <section id="scr-register" class="screen" hidden>
      <div class="card narrow">
        <img class="hero-logo" data-logo="full" alt="Tea Time">
        <h2>أهلاً بيك في <span class="cafeName"></span> 👋</h2>
        <p class="muted">اكتب اسمك ورقمك عشان نبدأ طلبك على ترابيزة <b class="tableNo"></b></p>
        <form id="regForm" novalidate>
          <label>الاسم<input id="name" autocomplete="name" maxlength="40" required></label>
          <label>رقم الموبايل<input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="15" dir="ltr" placeholder="01xxxxxxxxx" required></label>
          <p class="muted sm">بنسجّل اسمك ورقمك عشان نتابع طلباتك ونوصّلك بعروضنا.</p>
          <p class="err" id="regErr"></p>
          <button class="btn primary block" type="submit">اعرض المنيو</button>
        </form>
      </div>
    </section>
    <section id="scr-menu" class="screen" hidden>
      <div class="menu-top">
        <div class="search"><span class="s-ico">🔍</span><input id="q" type="search" placeholder="دوّر على مشروب… (مثلاً: مانجو)" autocomplete="off" enterkeyhint="search"><button id="qClear" type="button" aria-label="مسح" hidden>✕</button></div>
        <div class="cats" id="cats"></div>
      </div>
      <div id="menuList"></div>
      <div class="spacer"></div>
    </section>
    <section id="scr-bill" class="screen" hidden><div id="billBody"></div></section>
  </main>
  <div class="cartbar" id="cartBar" hidden>

<!-- ======================= شاشة الكاشير ======================= -->
<template id="tpl-cashier">
  <header class="topbar no-print">
    <div class="brand"><img class="logo" data-logo="badge" alt=""><div><b class="cafeName"></b><small>شاشة الكاشير <span id="roleLbl"></span></small></div></div>
    <div class="top-actions" id="cashTop" hidden>
      <select id="voiceStyle" class="voice-sel" title="صوت الطلب">
        <option value="normal">🗣️ اقرا الطلب بالصوت</option>
        <option value="bell">🔔 جرس بس</option>
      </select>
      <button class="btn warn sm" id="soundBtn">🔔 فعّل الصوت</button>
      <button class="btn ghost sm" id="logoutBtn" hidden>خروج</button>
    </div>
  </header>
  <div class="demo-banner no-print" id="demoBanner" hidden>⚠️ وضع تجريبي: البيانات على الجهاز ده بس. للتجربة افتح <a id="demoLink" target="_blank">صفحة ترابيزة 1</a> في تاب تانية واطلب.</div>
  <div class="conn-err no-print" id="connErr" hidden>⚠️ مفيش اتصال بالسيرفر — بنحاول تاني…</div>

  <!-- إعداد أول مرة -->
  <main id="setup" hidden>
    <div class="card">
      <img class="hero-logo" data-logo="full" alt="Tea Time" style="width:120px">
      <h2>تشغيل النظام أونلاين</h2>
      <p class="muted">عشان طلبات موبايلات الزباين توصل لجهاز الكاشير، النظام محتاج قاعدة بيانات مجانية على Supabase.</p>
      <ol class="steps">
        <li>ادخل <b>supabase.com</b> واعمل حساب مجاني، وبعدين <b>New Project</b>.</li>
        <li>من القائمة افتح <b>SQL Editor</b>، الصق الكود ده ودوس <b>Run</b>:
          <textarea class="code-box" id="sqlBox" readonly></textarea>
          <button class="btn ghost sm" id="copySql" style="margin-top:6px">📋 نسخ الكود</button></li>
        <li>افتح <b>Authentication → Sign In / Providers → Email</b> واقفل <b>Confirm email</b>.</li>
        <li>افتح <b>Project Settings → API</b> وانسخ <b>Project URL</b> و <b>anon public key</b> هنا:
          <label>Project URL<input id="suUrl" dir="ltr" placeholder="https://xxxxx.supabase.co"></label>
          <label>anon public key<input id="suKey" dir="ltr" placeholder="eyJhbGciOi..."></label></li>
      </ol>
      <p class="err" id="setupErr"></p>
      <div class="acts">
        <button class="btn primary" id="saveConn">اختبار وحفظ الاتصال</button>
        <button class="btn ghost" id="useDemo">جرّب الأول على الجهاز ده (وضع تجريبي)</button>
        <button class="btn ghost" id="cancelSetup" hidden>رجوع</button>
      </div>
    </div>
  </main>

  <!-- الدخول -->
  <main id="login" hidden>
    <div class="card narrow">
      <img class="hero-logo" data-logo="full" alt="Tea Time">
      <h2>دخول الكاشير</h2>
      <form id="loginForm">
        <label>اسم المستخدم<input id="lgUser" dir="ltr" autocomplete="username" autocapitalize="none" required placeholder="مثلاً: admin"></label>
        <label>الباسورد<input id="lgPw" type="password" dir="ltr" autocomplete="current-password" required minlength="6"></label>
        <p class="err" id="loginErr"></p>
        <button class="btn primary block" id="loginBtn">دخول</button>
      </form>
      <p class="center sm"><a href="#" id="toSetup">إعدادات الاتصال</a></p>
    </div>
  </main>

  <div id="app" hidden>
    <nav class="tabs no-print">
      <button data-tab="orders" class="on">الطلبات <span class="count" id="cntNew"></span></button>
      <button data-tab="bills">الحسابات <span class="count" id="cntBills"></span></button>
      <button data-tab="menu">المنيو والأسعار</button>
      <button data-tab="customers">العملاء <span class="count" id="cntCust"></span></button>
      <button data-tab="reports">📊 التقارير</button>
      <button data-tab="qr">أكواد QR</button>
      <button data-tab="settings">الإعدادات</button>
    </nav>
    <main>
      <div class="tab" id="tab-orders">
        <div class="board">
          <div class="col col-new"><h3><span>🟠 جديد</span><span id="n-new">0</span></h3><div id="col-new"></div></div>
          <div class="col col-preparing"><h3><span>🔵 بيتحضّر</span><span id="n-preparing">0</span></h3><div id="col-preparing"></div></div>
          <div class="col col-served"><h3><span>🟢 اتقدّم (مستني الدفع)</span><span id="n-served">0</span></h3><div id="col-served"></div></div>
        </div>
      </div>

      <div class="tab" id="tab-bills" hidden>
        <div class="stats" id="stats"></div>
        <div class="grid" id="billsList"></div>
      </div>

      <div class="tab" id="tab-menu" hidden>
        <div class="card">
          <h3>🔥 العروض</h3>
          <p class="muted sm">العرض بيظهر للزبون أول ما يفتح المنيو، ويقدر يطلبه زي أي صنف. مثال: "2 شاي + وافل نوتيلا" بـ 60.</p>

            <input type="hidden" id="oId">
            <label>اسم العرض<input id="oName" maxlength="60" required></label>
            <label>التفاصيل (اختياري)<input id="oDesc" maxlength="120" placeholder="بيشمل إيه"></label>
            <label>سعر العرض<input id="oPrice" type="number" min="0" step="0.5" dir="ltr" required></label>
            <label>السعر قبل العرض (اختياري)<input id="oOld" type="number" min="0" step="0.5" dir="ltr" placeholder="يظهر متشطّب"></label>
            <div class="acts" style="margin:10px 0"><button class="btn primary">حفظ العرض</button><button type="button" class="btn ghost" id="oCancel" hidden>إلغاء</button></div>
          </form>
          <div id="offersList"></div>
        </div>
        <form class="card" id="menuForm">
          <h3 id="mfTitle">إضافة صنف جديد</h3>
          <input type="hidden" id="mId">
          <div class="form-grid">
            <label>الاسم<input id="mName" maxlength="60" required></label>
            <label>القسم<input id="mCat" list="catList" maxlength="40" placeholder="قهوة، عصاير…" required></label>
            <label>السعر<input id="mPrice" type="number" min="0" step="0.5" dir="ltr" required></label>
            <label>وصف (اختياري)<input id="mDesc" maxlength="120"></label>
            <label>سعر بعد الخصم (اختياري)<input id="mOffer" type="number" min="0" step="0.5" dir="ltr" placeholder="فاضي = مفيش خصم"></label>
          </div>
          <label class="chk-inline"><input type="checkbox" id="mFeat"> ⭐ يظهر في "الأكثر مبيعاً"</label>
          <label class="chk-inline"><input type="checkbox" id="mSugar"> ☕ الزبون يختار السكر (زيادة / مظبوط / على الريحة / سادة)</label>
          <datalist id="catList"></datalist>
          <div class="acts"><button class="btn primary" type="submit">حفظ</button><button type="button" class="btn ghost" id="mCancel" hidden>إلغاء التعديل</button></div>
        </form>
        <div id="menuAdmin"></div>
        <p class="center"><button class="btn ghost sm" id="resetMenu" type="button">↺ رجّع منيو Tea Time الأساسي</button></p>
      </div>

      <div class="tab" id="tab-customers" hidden>
        <div class="stats" id="custStats"></div>
        <div class="card no-print">
          <div class="form-grid" style="align-items:end">
            <label>بحث بالاسم أو الرقم<input id="custSearch" placeholder="اكتب اسم أو رقم"></label>
            <label>ترتيب حسب<select id="custSort">
              <option value="last">آخر زيارة</option><option value="visits">الأكثر زيارة</option>
              <option value="spent">الأكثر شراء</option><option value="new">الأحدث تسجيلاً</option></select></label>
            <div><button class="btn ghost block" id="custExport" type="button" style="margin:10px 0">⬇️ تصدير Excel</button></div>
          </div>
        </div>
        <div class="card" style="overflow-x:auto">
          <table class="ctable"><thead><tr><th>العميل</th><th>الموبايل</th><th>الزيارات</th><th>طلبات مدفوعة</th><th>المشتريات</th><th>آخر زيارة</th></tr></thead>
          <tbody id="custBody"></tbody></table>
        </div>
      </div>
      <div class="sheet-bg" id="custModal" hidden><div class="sheet" id="custDetail"></div></div>

      <div class="tab" id="tab-reports" hidden>
        <div class="card no-print">
          <div class="rep-periods" id="repPeriods">
            <button class="chip on" data-p="today">النهارده</button><button class="chip" data-p="yesterday">امبارح</button>
            <button class="chip" data-p="week">آخر 7 أيام</button><button class="chip" data-p="month">الشهر ده</button>
            <button class="chip" data-p="lastmonth">الشهر اللي فات</button>
          </div>
          <div class="form-grid" style="align-items:end">
            <label>من يوم<input id="repFrom" type="date"></label>
            <label>لحد يوم<input id="repTo" type="date"></label>
            <div class="acts" style="margin:10px 0"><button class="btn primary" id="repGo" type="button">اعرض</button>
              <button class="btn ghost" id="repCsv" type="button">⬇️ Excel</button><button class="btn ghost" id="repPrint" type="button">🖨️ طباعة</button></div>
          </div>
        </div>
        <h2 class="print-only" id="repTitle"></h2>
        <div class="stats" id="repStats"></div>
        <div class="grid">
          <div class="card"><h3>📅 المبيعات بالأيام</h3><div id="repDaily"></div></div>
          <div class="card"><h3>📂 المبيعات بالأقسام</h3><div id="repCats"></div></div>
        </div>
        <div class="card">
          <div class="order-head"><h3>☕ مبيعات الأصناف</h3>
            <div class="acts no-print"><input id="repSearch" placeholder="بحث عن صنف" style="margin:0;width:170px;padding:7px 10px">
              <select id="repSort" class="rep-sort"><option value="revenue">الأعلى مبيعاً (فلوس)</option><option value="qty">الأكتر كمية</option><option value="low">الأقل مبيعاً</option></select></div></div>
          <div style="overflow-x:auto"><table class="ctable"><thead><tr><th>#</th><th>الصنف</th><th>القسم</th><th>الكمية</th><th>المبيعات</th><th>من الإجمالي</th></tr></thead><tbody id="repItems"></tbody></table></div>

          <div class="form-grid">
            <label>رابط الموقع<input id="qrBase" dir="ltr"></label>
            <label>من ترابيزة<input id="qrFrom" type="number" min="1" value="1"></label>

          </div>
          <div class="acts"><button class="btn primary">حفظ</button><span class="okt" id="setOk" hidden>اتحفظ ✓</span></div>

          <ol class="steps sm" id="publishSteps">
            <li>دوس <b>نزّل النسخة الجاهزة للرفع</b> (فيها بيانات الاتصال).</li>
            <li>ادخل <b>app.netlify.com/drop</b> واسحب الملف عليها، وسمّيه <b>index.html</b> قبل الرفع.</li>
            <li>افتح الرابط اللي هيطلعلك على جهاز الكاشير، وبعدين اطبع الأكواد من تاب <b>أكواد QR</b>.</li>
          </ol>
          <div class="acts">
            <button class="btn primary" id="dlFile" type="button">⬇️ نزّل النسخة الجاهزة للرفع</button>
            <button class="btn ghost" id="changeConn" type="button">تغيير الاتصال</button>
          </div>
          <input type="file" id="srcPick" accept=".html,text/html" hidden>
          <p class="muted sm" id="pickHint" hidden>اختار ملف النظام نفسه من جهازك عشان نجهّز منه النسخة.</p>
        </div>

        <div class="card">
          <h3>🗣️ صوت الطلبات</h3>
          <p class="muted sm">الصوت بيطلع من المتصفح نفسه، فلازم الجهاز يكون فيه صوت عربي. أحسن صوت مصري: افتح الكاشير من متصفح <b>Microsoft Edge</b> واختار <b>Salma</b> أو <b>Shakir (Egypt)</b>.</p>
          <div class="form-grid" style="align-items:end">
            <label>الصوت<select id="voicePick"></select></label>
            <label>السرعة<select id="voiceRate"><option value="0.9">هادي</option><option value="1" selected>عادي</option><option value="1.12">سريع</option></select></label>
            <div><button class="btn primary block" id="voiceTest" type="button" style="margin:10px 0">▶️ جرّب الصوت</button></div>
          </div>
          <p class="warn-box" id="voiceWarn" hidden></p>
        </div>
        <div class="card">
          <h3>تحديث قاعدة البيانات</h3>
          <p class="muted sm">لما النظام يتحدّث بميزة جديدة (زي العروض والأكثر مبيعاً)، انسخ الكود ده وشغّله تاني في Supabase → SQL Editor. مش بيمسح أي بيانات.</p>
          <button class="btn ghost sm" id="copySql2" type="button">📋 نسخ كود SQL</button>
        </div>
        <div class="card" id="staffCard" hidden>
          <h3>👥 الموظفين والصلاحيات</h3>
          <p class="muted sm"><b>صاحب المحل:</b> كل حاجة · <b>ويتر:</b> الطلبات والحسابات بس (من غير مبيعات) · <b>بار:</b> شاشة الطلبات بس (يحضّر ويقدّم)</p>
          <div id="staffList"></div>
          <form id="staffForm" class="form-grid" style="align-items:end">
            <label>اسم المستخدم<input id="stUser" dir="ltr" autocapitalize="none" required placeholder="مثلاً: bar1"></label>
            <label>الباسورد (6 حروف على الأقل)<input id="stPw" type="text" dir="ltr" minlength="6" required autocomplete="off"></label>
            <label>الصلاحية<select id="stRole"><option value="waiter">ويتر</option><option value="bar">بار</option><option value="owner">صاحب المحل</option></select></label>
            <div><button class="btn primary block" style="margin:10px 0">إضافة موظف</button></div>
          </form>
          <p class="muted sm">لو اسم المستخدم موجود، الباسورد والصلاحية هيتغيّروا.</p>
          <p class="err" id="staffErr"></p>
        </div>
      </div>
    </main>
  </div>
</template>

const SETUP_SQL = String.raw`-- ===== Tea Time: نظام طلبات الكافيه بالـQR =====
create extension if not exists pgcrypto;

create table if not exists public.cafe_settings (
  id int primary key default 1 check (id = 1),
  cafe_name text not null default 'Tea Time',
  currency text not null default 'ج.م',
  service_percent numeric(5,2) not null default 0
);
insert into public.cafe_settings (id) values (1) on conflict do nothing;

create table if not exists public.staff (
  email text primary key,
  created_at timestamptz not null default now()
);
-- الصلاحيات: owner = صاحب المحل (كل حاجة)، waiter = ويتر (الطلبات والحسابات)، bar = البار (الطلبات بس)
alter table public.staff add column if not exists role text not null default 'owner';
do $$ begin
  alter table public.staff add constraint staff_role_chk check (role in ('owner','waiter','bar'));
exception when duplicate_object then null; end $$;

create table if not exists public.menu_items (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  category text not null default 'مشروبات',
  price numeric(10,2) not null check (price >= 0),

  sort int not null default 0,
  created_at timestamptz not null default now()
);

  order_no bigint generated always as identity,
  session_id uuid not null,
  table_no int not null,

create or replace function public.set_order_status(p_id uuid, p_status text) returns void
language plpgsql security definer set search_path = public as $$
declare r text := public.my_role();
begin
  if r is null then raise exception 'not allowed'; end if;
  if p_status not in ('new','preparing','served','paid','cancelled') then raise exception 'invalid status'; end if;
  if r = 'bar' and p_status not in ('new','preparing','served') then raise exception 'not allowed'; end if;
  update public.orders set status = p_status, updated_at = now() where id = p_id;
end $$;

  update public.orders set status = 'paid', updated_at = now() where session_id = p_session and status in ('new','preparing','served');
end $$;

-- بتتنادى لما الزبون يكتب اسمه ورقمه (الزيارة بتتحسب لو آخر مرة كانت من أكتر من ساعتين)
drop function if exists public.register_customer(text, text);
create or replace function public.register_customer(p_name text, p_phone text, p_device text default null) returns void
language plpgsql security definer set search_path = public as $$
begin
  if coalesce(length(trim(p_name)), 0) < 2 then raise exception 'invalid name'; end if;
  if coalesce(p_phone, '') !~ '^\+?[0-9]{8,15}$' then raise exception 'invalid phone'; end if;
  if p_device is not null and length(p_device) > 64 then raise exception 'invalid device'; end if;
  if exists (select 1 from public.blocked where value in (p_phone, coalesce(p_device, '-'))) then raise exception 'blocked'; end if;
  insert into public.customers (phone, name, device_id) values (p_phone, left(trim(p_name), 40), p_device)
  on conflict (phone) do update set name = excluded.name, last_seen = now(), device_id = coalesce(excluded.device_id, public.customers.device_id),
    visits = public.customers.visits + case when public.customers.last_seen < now() - interval '2 hours' then 1 else 0 end;
end $$;

-- لو الزبون فتح الكود تاني (أو من متصفح تاني) على نفس الترابيزة، يرجع لنفس حسابه المفتوح

language sql stable security definer set search_path = public as $$
  select session_id from public.orders
  where customer_phone = p_phone and table_no = p_table and status in ('new','preparing','served')
    and created_at > now() - interval '12 hours'
  order by created_at desc limit 1;
$$;

create or replace function public.list_customers()
returns table (phone text, name text, first_seen timestamptz, last_seen timestamptz, visits int, notes text,
               orders_count bigint, total_spent numeric, last_order timestamptz,
               cancelled_count bigint, devices_count bigint, blocked boolean)
language sql stable security definer set search_path = public as $$
  select c.phone, c.name, c.first_seen, c.last_seen, c.visits, c.notes,
         count(o.id) filter (where o.status = 'paid'),
         coalesce(sum(o.total) filter (where o.status = 'paid'), 0),
         max(o.created_at),
         count(o.id) filter (where o.status = 'cancelled'),
         count(distinct o.device_id),
         exists (select 1 from public.blocked b where b.value = c.phone)
  from public.customers c
  left join public.orders o on o.customer_phone = c.phone
  where public.is_owner()
  group by c.phone
  order by c.last_seen desc;
$$;

-- حظر / فك حظر عميل (بالرقم وكل الأجهزة اللي طلب منها)
create or replace function public.block_customer(p_phone text, p_on boolean) returns void
language plpgsql security definer set search_path = public as $$
begin
  if coalesce(public.my_role(), '') not in ('owner', 'waiter') then raise exception 'not allowed'; end if;
  if p_on then
    insert into public.blocked (value, kind) values (p_phone, 'phone') on conflict do nothing;
    insert into public.blocked (value, kind)
      select distinct d, 'device' from (
        select device_id d from public.orders where customer_phone = p_phone
        union select device_id from public.customers where phone = p_phone) x
      where d is not null
    on conflict do nothing;
    update public.orders set status = 'cancelled', updated_at = now() where customer_phone = p_phone and status = 'new';
  else
    delete from public.blocked where value = p_phone or value in (
      select device_id from public.orders where customer_phone = p_phone and device_id is not null
      union select device_id from public.customers where phone = p_phone and device_id is not null);
  end if;
end $$;

-- الزبون بيطلب عن طريق الدالة دي بس، والأسعار بتتحسب من المنيو على السيرفر
drop function if exists public.place_order(uuid, int, text, text, jsonb, text);
create or replace function public.place_order(p_session uuid, p_table int, p_name text, p_phone text, p_items jsonb, p_note text default null, p_device text default null)
returns public.orders language plpgsql security definer set search_path = public as $$
declare v_items jsonb := '[]'::jsonb; v_total numeric := 0; r record; v_order public.orders; v_other boolean := false;
begin
  if p_device is not null and length(p_device) > 64 then raise exception 'invalid device'; end if;
  if exists (select 1 from public.blocked where value in (p_phone, coalesce(p_device, '-'))) then raise exception 'blocked'; end if;
  if p_device is not null then
    if (select count(*) from public.orders where device_id = p_device and status = 'new') >= 3 then raise exception 'too many pending'; end if;
    if (select count(*) from public.orders where device_id = p_device and created_at > now() - interval '10 minutes') >= 6 then raise exception 'too many orders'; end if;
    v_other := exists (select 1 from public.orders where customer_phone = p_phone and device_id is not null and device_id <> p_device);
  end if;
  if p_session is null then raise exception 'invalid session'; end if;
  if p_table is null or p_table < 1 or p_table > 500 then raise exception 'invalid table'; end if;
  if coalesce(length(trim(p_name)), 0) < 2 then raise exception 'invalid name'; end if;
  if coalesce(p_phone, '') !~ '^\+?[0-9]{8,15}$' then raise exception 'invalid phone'; end if;
  if jsonb_typeof(p_items) <> 'array' or jsonb_array_length(p_items) > 60 then raise exception 'invalid items'; end if;
  if exists (select 1 from public.orders where session_id = p_session and status = 'paid') then raise exception 'session closed'; end if;
  if (select count(*) from public.orders where customer_phone = p_phone and created_at > now() - interval '10 minutes') >= 6 then
    raise exception 'too many orders';
  end if;
  for r in
    select m.id, m.name,
           case when m.sugar and (x.e ->> 'opt') in ('زيادة','مظبوط','على الريحة','سادة') then x.e ->> 'opt' end as opt,
           case when m.offer_price is not null and m.offer_price < m.price then m.offer_price else m.price end as price,
           least(greatest(coalesce((x.e ->> 'qty')::int, 1), 1), 50) as qty
    from jsonb_array_elements(p_items) with ordinality x(e, n)
    join public.menu_items m on m.id::text = (x.e ->> 'id') and m.available
    order by x.n
  loop
    v_items := v_items || jsonb_strip_nulls(jsonb_build_object('id', r.id, 'name', r.name, 'price', r.price, 'qty', r.qty, 'opt', r.opt));
    v_total := v_total + r.price * r.qty;
  end loop;
  if jsonb_array_length(v_items) = 0 then raise exception 'empty order'; end if;
  insert into public.orders (session_id, table_no, customer_name, customer_phone, items, total, note, device_id, other_device)
  values (p_session, p_table, left(trim(p_name), 40), p_phone, v_items, v_total, left(nullif(trim(coalesce(p_note, '')), ''), 300), p_device, v_other)
  returning * into v_order;
  insert into public.customers (phone, name, device_id) values (p_phone, left(trim(p_name), 40), p_device)
  on conflict (phone) do update set name = excluded.name, last_seen = now(), device_id = coalesce(excluded.device_id, public.customers.device_id);
  return v_order;
end $$;

create or replace function public.claim_first_staff() returns boolean
language plpgsql security definer set search_path = public as $$
declare e text := lower(coalesce(auth.jwt() ->> 'email', ''));
begin
  if e = '' then return false; end if;
  if not exists (select 1 from public.staff) then insert into public.staff (email, role) values (e, 'owner'); end if;
  return exists (select 1 from public.staff where lower(email) = e);
end $$;

-- صاحب المحل بيعمل حساب موظف (أو يغيّر الباسورد) من غير ما يحتاج تأكيد إيميل
create or replace function public.create_staff(p_username text, p_password text, p_role text) returns void
language plpgsql security definer set search_path = public, extensions as $$
declare v_email text; v_id uuid;
begin
  if not public.is_owner() then raise exception 'not allowed'; end if;
  p_username := lower(trim(p_username));
  if p_username !~ '^[a-z0-9_.-]{3,30}$' then raise exception 'invalid username'; end if;
  if length(coalesce(p_password, '')) < 6 then raise exception 'weak password'; end if;
  if p_role not in ('owner','waiter','bar') then raise exception 'invalid role'; end if;
  v_email := p_username || '@teatime-local.app';
  select id into v_id from auth.users where email = v_email;
  if v_id is null then
    v_id := gen_random_uuid();
    insert into auth.users (instance_id, id, aud, role, email, encrypted_password, email_confirmed_at,
      raw_app_meta_data, raw_user_meta_data, created_at, updated_at, confirmation_token, recovery_token,
      email_change, email_change_token_new, email_change_token_current, phone_change, phone_change_token, reauthentication_token)
    values ('00000000-0000-0000-0000-000000000000', v_id, 'authenticated', 'authenticated', v_email,
      extensions.crypt(p_password, extensions.gen_salt('bf')), now(),
      '{"provider":"email","providers":["email"]}'::jsonb, '{}'::jsonb, now(), now(), '', '', '', '', '', '', '', '');
    insert into auth.identities (id, user_id, provider_id, identity_data, provider, last_sign_in_at, created_at, updated_at)
    values (gen_random_uuid(), v_id, v_id::text, jsonb_build_object('sub', v_id::text, 'email', v_email, 'email_verified', true), 'email', now(), now(), now());
  else
    update auth.users set encrypted_password = extensions.crypt(p_password, extensions.gen_salt('bf')),
      email_confirmed_at = coalesce(email_confirmed_at, now()), updated_at = now() where id = v_id;
  end if;
  insert into public.staff (email, role) values (v_email, p_role) on conflict (email) do update set role = excluded.role;
end $$;

create or replace function public.set_staff_role(p_email text, p_role text) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not public.is_owner() then raise exception 'not allowed'; end if;
  if p_role not in ('owner','waiter','bar') then raise exception 'invalid role'; end if;
  if lower(p_email) = lower(coalesce(auth.jwt() ->> 'email', '')) then raise exception 'cannot change self'; end if;
  update public.staff set role = p_role where lower(email) = lower(p_email);
end $$;

create or replace function public.remove_staff(p_email text) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not public.is_owner() then raise exception 'not allowed'; end if;
  if lower(p_email) = lower(coalesce(auth.jwt() ->> 'email', '')) then raise exception 'cannot remove self'; end if;
  delete from public.staff where lower(email) = lower(p_email);
end $$;

-- ===== التقارير (صاحب المحل بس) — الطلبات المدفوعة بس، بأسعار الأصناف قبل خصم الحساب والخدمة =====
create or replace function public.sales_items(p_from timestamptz, p_to timestamptz)
returns table (name text, category text, qty bigint, revenue numeric, orders bigint)
language sql stable security definer set search_path = public as $$
  select it ->> 'name', coalesce(m.category, 'أصناف محذوفة'),
         sum((it ->> 'qty')::int), sum((it ->> 'qty')::int * (it ->> 'price')::numeric), count(distinct o.id)
  from public.orders o
  cross join lateral jsonb_array_elements(o.items) it
  left join public.menu_items m on m.id::text = it ->> 'id'
  where public.is_owner() and o.status = 'paid' and o.created_at >= p_from and o.created_at < p_to
  group by 1, 2 order by 4 desc;
$$;

create or replace function public.sales_daily(p_from timestamptz, p_to timestamptz)
returns table (day date, orders bigint, revenue numeric, customers bigint)
language sql stable security definer set search_path = public as $$
  select (o.created_at at time zone 'Africa/Cairo')::date, count(*), sum(o.total), count(distinct o.customer_phone)
  from public.orders o
  where public.is_owner() and o.status = 'paid' and o.created_at >= p_from and o.created_at < p_to
  group by 1 order by 1;
$$;

  async placeOrder({ session, table, name, phone, items, note, device }) {

    if (s.orders.some(o => o.session_id === session && o.status === 'paid')) throw new Error('session closed');
    const lines = []; let total = 0;
    items.forEach(x => {
      const m = s.menu.find(m => m.id === x.id && m.available); if (!m) return;
      const qty = Math.min(Math.max(parseInt(x.qty, 10) || 1, 1), 50);
      const opt = m.sugar && SUGAR_OPTS.some(o => o[0] === x.opt) ? x.opt : undefined;
      lines.push({ id: m.id, name: m.name, price: effPrice(m), qty, ...(opt ? { opt } : {}) }); total += effPrice(m) * qty;
    });

      items: lines, total, note: (note || '').slice(0, 300) || null, status: 'new', created_at: new Date().toISOString() };
    s.orders.push(o);
      s.customers = s.customers || {};

  async listOrders() {

  },
  async updateOrderStatus(id, status) { const s = dLoad(); const o = s.orders.find(o => o.id === id); if (o) { o.status = status; dSave(s); } },
  async closeSession(session) { const s = dLoad(); s.orders.forEach(o => { if (o.session_id === session && ACTIVE.includes(o.status)) o.status = 'paid'; }); dSave(s); },
  async saveMenuItem(i) {

      kind: i.kind || 'item', featured: !!i.featured, sugar: !!i.sugar, offer_price: i.offer_price == null || i.offer_price === '' ? null : Number(i.offer_price) };

  async deleteMenuItem(id) { const s = dLoad(); s.menu = s.menu.filter(m => m.id !== id); dSave(s); },
  async resetMenu() { const s = dLoad(); s.menu = [...s.menu.filter(m => m.kind === 'offer'), ...seedMenu()]; dSave(s); },
  async resumeSession(phone, table) {
    const t = Date.now() - 12 * 3600e3;
    const o = dLoad().orders.filter(o => o.customer_phone === phone && o.table_no === table && ACTIVE.includes(o.status) && new Date(o.created_at) > t).pop();
    return o ? o.session_id : null;
  },
  async registerCustomer(name, phone, device) {
    const s = dLoad(); s.customers = s.customers || {};

    const c = s.customers[phone], now = new Date().toISOString();
    if (!c) s.customers[phone] = { phone, name, first_seen: now, last_seen: now, visits: 1, notes: '' };
    else { if (Date.now() - new Date(c.last_seen) > 2 * 3600e3) c.visits++; c.name = name; c.last_seen = now; }

  },
  async listCustomers() {

      return { ...c, orders_count: paid.length, total_spent: paid.reduce((a, o) => a + Number(o.total), 0), last_order: os.length ? os[os.length - 1].created_at : null,
        cancelled_count: os.filter(o => o.status === 'cancelled').length, devices_count: new Set(os.map(o => o.device_id).filter(Boolean)).size, blocked: (s.blocked || []).includes(c.phone) };
    });
  },

  async blockCustomer(phone, on) {
    const s = dLoad(); s.blocked = s.blocked || [];
    const devs = [...new Set(s.orders.filter(o => o.customer_phone === phone).map(o => o.device_id).filter(Boolean))];
    if (on) { s.blocked = [...new Set([...s.blocked, phone, ...devs])]; s.orders.forEach(o => { if (o.customer_phone === phone && o.status === 'new') o.status = 'cancelled'; }); }
    else s.blocked = s.blocked.filter(b => b !== phone && !devs.includes(b));

  onChange(cb) { window.addEventListener('storage', e => { if (e.key === LS_DATA) cb(); }); },
  async getUser() { return { demo: true }; },
  async signIn() {}, async signUp() {}, async signOut() {},
  async listStaff() { return []; }, async createStaff() {}, async setStaffRole() {}, async removeStaff() {},
  async myRole() { return 'owner'; },
  async salesItems(from, to) {
    const s = dLoad(), m = new Map();
    s.orders.filter(o => o.status === 'paid' && new Date(o.created_at) >= from && new Date(o.created_at) < to).forEach(o => o.items.forEach(i => {
      const mi = s.menu.find(x => x.id === i.id), cat = mi ? mi.category : 'أصناف محذوفة', k = i.name + '|' + cat;
      const x = m.get(k) || { name: i.name, category: cat, qty: 0, revenue: 0, orders: new Set() };
      x.qty += i.qty; x.revenue += i.qty * Number(i.price); x.orders.add(o.id); m.set(k, x);
    }));
    return [...m.values()].map(x => ({ ...x, orders: x.orders.size })).sort((a, b) => b.revenue - a.revenue);
  },
  async salesDaily(from, to) {
    const m = new Map();
    dLoad().orders.filter(o => o.status === 'paid' && new Date(o.created_at) >= from && new Date(o.created_at) < to).forEach(o => {
      const d = new Date(o.created_at), k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const x = m.get(k) || { day: k, orders: 0, revenue: 0, customers: new Set() }; x.orders++; x.revenue += Number(o.total); x.customers.add(o.customer_phone); m.set(k, x);
    });
    return [...m.values()].map(x => ({ ...x, customers: x.customers.size })).sort((a, b) => a.day.localeCompare(b.day));
  },
};

function cloudDB(conn) {
  if (!window.supabase) throw new Error('مكتبة Supabase متحملتش — اتأكد من النت');
  const sb = window.supabase.createClient(conn.url, conn.key, { auth: { storageKey: 'tt_auth' } });
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  async function claim() {
    const r = await sb.rpc('claim_first_staff');
    if (r.error) { await sb.auth.signOut(); throw new Error('sql missing: ' + r.error.message); }
    if (!r.data) { await sb.auth.signOut(); throw new Error('not staff'); }
  }
  return {
    async getSettings() { return chk(await sb.from('cafe_settings').select('*').eq('id', 1).maybeSingle()) || S; },
    async saveSettings(v) { chk(await sb.from('cafe_settings').update(v).eq('id', 1)); },
    async getMenu(all) {
      let q = sb.from('menu_items').select('*').order('sort').order('name');
      if (!all) q = q.eq('available', true);
      return chk(await q).map(m => ({ ...m, price: Number(m.price), offer_price: m.offer_price == null ? null : Number(m.offer_price) }));
    },
    async placeOrder({ session, table, name, phone, items, note, device }) {
      return chk(await sb.rpc('place_order', { p_session: session, p_table: table, p_name: name, p_phone: phone, p_items: items, p_note: note || null, p_device: device || null }));
    },
    async getBill(session) { return chk(await sb.rpc('get_bill', { p_session: session })) || []; },
    async listOrders() {
      return chk(await sb.from('orders').select('*').or(`created_at.gte."${since24h()}",status.in.(new,preparing,served)`)
        .order('created_at', { ascending: false }).limit(500));
    },
    async updateOrderStatus(id, status) { chk(await sb.rpc('set_order_status', { p_id: id, p_status: status })); },
    async closeSession(session) { chk(await sb.rpc('close_session', { p_session: session })); },
    async saveMenuItem(i) {
      const row = { name: i.name, category: i.category, price: Number(i.price), description: i.description || null, available: i.available !== false, sort: i.sort || 0,
        kind: i.kind || 'item', featured: !!i.featured, sugar: !!i.sugar, offer_price: i.offer_price == null || i.offer_price === '' ? null : Number(i.offer_price) };
      chk(i.id ? await sb.from('menu_items').update(row).eq('id', i.id) : await sb.from('menu_items').insert(row));
    },
    async deleteMenuItem(id) { chk(await sb.from('menu_items').delete().eq('id', id)); },
    async resetMenu() {
      chk(await sb.from('menu_items').delete().neq('kind', 'offer'));
      chk(await sb.from('menu_items').insert(SEED.map((m, i) => ({ name: m[0], category: m[1], price: m[2], available: m[3], sort: i + 1, sugar: SUGAR_DEFAULT.includes(m[0]) }))));
    },
    onChange(cb) { sb.channel('orders-live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => cb()).subscribe(); },
    async getUser() {
      const { data } = await sb.auth.getSession();
      const user = data.session && data.session.user; if (!user) return null;
      const r = await sb.rpc('is_staff'); return r.data ? user : null;
    },
    async signIn(username, password) {
      chk(await sb.auth.signInWithPassword({ email: userToEmail(username), password }));
      await claim();
    },
    async signUp(username, password) {
      const d = chk(await sb.auth.signUp({ email: userToEmail(username), password }));
      if (!d.session) throw new Error('confirm email');
      await claim();
    },
    async signOut() { await sb.auth.signOut(); },
    async listStaff() { return chk(await sb.rpc('list_staff')) || []; },
    async myRole() { return chk(await sb.rpc('my_role')) || 'owner'; },
    async createStaff(username, password, role) { chk(await sb.rpc('create_staff', { p_username: username.toLowerCase(), p_password: password, p_role: role })); },
    async setStaffRole(email, role) { chk(await sb.rpc('set_staff_role', { p_email: email, p_role: role })); },
    async salesItems(from, to) {
      return (chk(await sb.rpc('sales_items', { p_from: from.toISOString(), p_to: to.toISOString() })) || []).map(r => ({ ...r, qty: Number(r.qty), revenue: Number(r.revenue), orders: Number(r.orders) }));
    },
    async salesDaily(from, to) {
      return (chk(await sb.rpc('sales_daily', { p_from: from.toISOString(), p_to: to.toISOString() })) || []).map(r => ({ ...r, orders: Number(r.orders), revenue: Number(r.revenue), customers: Number(r.customers) }));
    },
    async removeStaff(email) { chk(await sb.rpc('remove_staff', { p_email: email })); },
    async registerCustomer(name, phone, device) { chk(await sb.rpc('register_customer', { p_name: name, p_phone: phone, p_device: device || null })); },
    async blockCustomer(phone, on) { chk(await sb.rpc('block_customer', { p_phone: phone, p_on: !!on })); },
    async resumeSession(phone, table) { return chk(await sb.rpc('resume_session', { p_phone: phone, p_table: table })) || null; },
    async listCustomers() {
      return (chk(await sb.rpc('list_customers')) || []).map(c => ({ ...c, visits: Number(c.visits), orders_count: Number(c.orders_count), total_spent: Number(c.total_spent),
        cancelled_count: Number(c.cancelled_count || 0), devices_count: Number(c.devices_count || 0) }));
    },
    async customerOrders(phone) { return chk(await sb.from('orders').select('*').eq('customer_phone', phone).order('created_at', { ascending: false }).limit(200)); },
    async saveCustomerNote(phone, notes) { chk(await sb.from('customers').update({ notes: notes || null }).eq('phone', phone)); },
    async currentEmail() { const { data } = await sb.auth.getSession(); return data.session && data.session.user.email; },
  };
}

      s.orders.push(o); s.total += Number(o.total); if (o.status !== 'served') s.pending++;

        <td dir="ltr"><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a><a class="wa" href="${waLink(c.phone)}" target="_blank" rel="noopener">WhatsApp</a></td>
        <td>${c.visits}</td><td>${c.orders_count}</td><td>${money(c.total_spent)}</td><td>${when(c.last_seen)}</td></tr>`).join('')
      || `<tr><td colspan="6" class="muted center">${customers.length ? 'مفيش نتايج للبحث ده' : 'لسه مفيش عملاء — أول ما حد يسجّل اسمه ورقمه من الـQR هيظهر هنا'}</td></tr>`;
  }
  $('#custSearch').oninput = renderCustomers;
  $('#custSort').onchange = renderCustomers;
  $('#custBody').onclick = e => { if (e.target.closest('a')) return; const r = e.target.closest('tr[data-p]'); if (r) openCustomer(r.dataset.p); };
  async function openCustomer(phone) {
    const c = custMap.get(phone); if (!c) return;
    const head = `<div class="sheet-head"><h3>${esc(c.name)}</h3><button class="icon" data-close aria-label="إغلاق">✕</button></div>
      <div class="cust" dir="ltr" style="text-align:right"><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a><a class="wa" href="${waLink(c.phone)}" target="_blank" rel="noopener">WhatsApp</a></div>`;
    $('#custDetail').innerHTML = head + '<p class="muted">بنحمّل الطلبات…</p>';
    $('#custModal').hidden = false;
    let os = [];
    try { os = await DB.customerOrders(phone); } catch (e) { console.error(e); }
    const valid = os.filter(o => o.status !== 'cancelled'), paid = os.filter(o => o.status === 'paid');
    const spent = paid.reduce((a, o) => a + Number(o.total), 0);
    const top = mergeItems(valid).sort((a, b) => b.qty - a.qty).slice(0, 3);
    const ST = { new: ['جديد', 's-new'], preparing: ['بيتحضّر', 's-prep'], served: ['اتقدّم', 's-served'], paid: ['اتدفع', 's-paid'], cancelled: ['اتلغى', 's-cancel'] };
    $('#custDetail').innerHTML = head + `
      <div class="mini-stats">
        <div><small>أول زيارة</small><b>${new Date(c.first_seen).toLocaleDateString('ar-EG')}</b></div>
        <div><small>آخر زيارة</small><b>${when(c.last_seen)}</b></div>
        <div><small>الزيارات</small><b>${c.visits}</b></div>
        <div><small>طلبات مدفوعة</small><b>${paid.length}</b></div>
        <div><small>المشتريات</small><b>${money(spent)}</b></div>
        <div><small>متوسط الطلب</small><b>${paid.length ? money(spent / paid.length) : '—'}</b></div>
      </div>
      ${top.length ? `<p><b>بيحب:</b> ${top.map(i => `${esc(iname(i))} (${i.qty})`).join('، ')}</p>` : ''}
      <label>ملاحظات عن العميل<textarea id="custNote" rows="2" maxlength="500" placeholder="مثلاً: بيحب القهوة سادة، عيد ميلاده في مارس…">${esc(c.notes || '')}</textarea></label>
      <div class="acts"><button class="btn primary sm" id="saveNote">حفظ الملاحظات</button>
        <button class="btn ${c.blocked ? 'ok' : 'ghost danger-t'} sm" id="toggleBlock">${c.blocked ? '✅ فك الحظر' : '🚫 حظر العميل'}</button></div>
      <p class="muted sm">طلبات اتلغت: ${c.cancelled_count || 0} · موبايلات طلب منها: ${c.devices_count || 0}${c.blocked ? ' · <b class="danger-t">محظور — مش هيقدر يطلب أونلاين</b>' : ''}</p>
      <h3 style="margin-top:14px">سجل الطلبات (${os.length})</h3>
      ${os.map(o => `<div class="hist"><div class="order-head"><span>${new Date(o.created_at).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' })} · ترابيزة ${o.table_no}</span><span class="badge ${ST[o.status][1]}">${ST[o.status][0]}</span></div>
        <div>${o.items.map(i => `${i.qty}× ${ihtml(i)}`).join('، ')}</div><b>${money(o.total)}</b></div>`).join('') || '<p class="muted">لسه مطلبش حاجة.</p>'}`;
    $('#toggleBlock').onclick = async () => {
      const on = !c.blocked;
      if (on && !confirm(`حظر ${c.name}؟ مش هيقدر يطلب أونلاين من الرقم ده ولا من الموبايلات اللي طلب منها، وطلباته الجديدة هتتلغي.`)) return;
      try { await DB.blockCustomer(phone, on); toast(on ? 'اتحظر 🚫' : 'اتفك الحظر ✓'); $('#custModal').hidden = true; await loadCustomers(); loadOrders(); } catch (err) { alert(dbErr(err)); }
    };
    $('#saveNote').onclick = async () => {
      try { await DB.saveCustomerNote(phone, $('#custNote').value.trim()); toast('اتحفظت ✓'); loadCustomers(); } catch (err) { alert(dbErr(err)); }
    };
  }
  $('#custModal').onclick = e => { if (e.target.id === 'custModal' || e.target.closest('[data-close]')) $('#custModal').hidden = true; };
  $('#custExport').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = [['الاسم', 'الموبايل', 'أول زيارة', 'آخر زيارة', 'الزيارات', 'طلبات مدفوعة', 'المشتريات', 'ملاحظات']]
      .concat(filteredCustomers().map(c => [c.name, '="' + c.phone + '"', new Date(c.first_seen).toLocaleString('en-GB'), new Date(c.last_seen).toLocaleString('en-GB'), c.visits, c.orders_count, c.total_spent, c.notes || '']));
    const csv = '﻿' + rows.map(r => r.map((v, i) => i === 1 && String(v).startsWith('=') ? v : q(v)).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'tea-time-customers-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  };

  /* ----- QR ----- */
  function initQR() {
    $('#qrBase').value = siteBase();
    const w = [];
    if (location.protocol === 'file:') w.push('إنت فاتح الملف من جهازك، فالرابط ده مش هيفتح على موبايلات الزباين. ارفع الملف الأول (شوف تاب الإعدادات) وافتح الكاشير من الرابط الجديد، أو حط رابط الموقع هنا.');
    if (DEMO) w.push('النظام شغال وضع تجريبي، فالطلبات من الموبايلات مش هتوصل. اربطه بـ Supabase الأول.');
    else if (CONN.source === 'device') w.push('بيانات الاتصال لسه مش جوه الملف المرفوع — نزّل النسخة الجاهزة من الإعدادات وارفعها قبل ما تطبع.');
    $('#qrWarn').innerHTML = w.map(esc).join('<br>'); $('#qrWarn').hidden = !w.length;
    genQR();
  }
  function genQR() {
    const grid = $('#qrGrid');
    if (!window.QRCode) { grid.innerHTML = '<p class="err">مكتبة الـQR متحملتش — اتأكد من النت</p>'; return; }
    const base = $('#qrBase').value.trim();
    const a = Math.max(1, parseInt($('#qrFrom').value, 10) || 1), b = Math.min(a + 199, Math.max(a, parseInt($('#qrTo').value, 10) || a));
    grid.innerHTML = '';
    for (let n = a; n <= b; n++) {
      const url = base + (base.includes('?') ? '&' : '?') + 't=' + n;
      const card = document.createElement('div'); card.className = 'qr-card';
      card.innerHTML = `<img class="qr-logo" src="${LOGO_FULL}" alt=""><div class="qr-code"></div><b class="qr-t">ترابيزة ${n}</b><small>امسح الكود واطلب من موبايلك</small>`;
      grid.appendChild(card);
      new QRCode(card.querySelector('.qr-code'), { text: url, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });
    }
  }
  $('#qrGen').onclick = genQR;
  $('#qrPrint').onclick = () => window.print();

  /* ----- الإعدادات ----- */
  function initSettings() {
    $('#sName').value = S.cafe_name; $('#sCur').value = S.currency; $('#sSvc').value = S.service_percent || 0;
    $('#sAnn').value = S.announcement || ''; $('#sDisc').value = Number(S.bill_discount) || ''; $('#sDiscLabel').value = S.discount_label || '';
    $('#connStatus').innerHTML = DEMO ? '🟠 <b>وضع تجريبي</b> — البيانات على الجهاز ده بس.' : `🟢 متصل بـ <span dir="ltr">${esc(CONN.url)}</span>`;
    $('#publishWarn').hidden = DEMO || CONN.source !== 'device';
    $('#dlFile').hidden = DEMO; $('#publishSteps').hidden = DEMO;
    $('#changeConn').textContent = DEMO ? 'اربط بـ Supabase' : 'تغيير الاتصال';
    $('#staffCard').hidden = DEMO;
    if (!DEMO) loadStaff();
  }
  $('#setForm').onsubmit = async e => {
    e.preventDefault();
    const v = { cafe_name: $('#sName').value.trim() || 'Tea Time', currency: $('#sCur').value.trim() || 'ج.م', service_percent: Math.max(0, Number($('#sSvc').value) || 0),
      announcement: $('#sAnn').value.trim() || null, bill_discount: Math.min(100, Math.max(0, Number($('#sDisc').value) || 0)), discount_label: $('#sDiscLabel').value.trim() || null };
    try { await DB.saveSettings(v); S = { ...S, ...v }; applyName(); document.title = baseTitle(); renderOrders(); renderBills(); loadMenu(); genQR();
      $('#setOk').hidden = false; setTimeout(() => $('#setOk').hidden = true, 2000); }
    catch (err) { alert('مقدرناش نحفظ: ' + dbErr(err)); }
  };
  $('#copySql2').onclick = () => $('#copySql').click();
  $('#changeConn').onclick = () => showSetup(true);

  function buildFile(src) {
    const block = '/*CONFIG_' + 'START*/\nconst EMBEDDED = ' + JSON.stringify({ supabaseUrl: CONN.url, supabaseAnonKey: CONN.key }, null, 2) + ';\n/*CONFIG_' + 'END*/';
    const re = /\/\*CONFIG_START\*\/[\s\S]*?\/\*CONFIG_END\*\//;
    if (!re.test(src) || !src.includes('tpl-cashier')) throw new Error('bad file');
    const out = src.replace(re, () => block);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/html' }));
    a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
    toast('اتنزّل index.html — ارفعه دلوقتي');
  }
  $('#dlFile').onclick = async () => {
    if (location.protocol === 'file:') { $('#pickHint').hidden = false; $('#srcPick').click(); return; }
    try { const r = await fetch(siteBase(), { cache: 'no-store' }); if (!r.ok) throw 0; buildFile(await r.text()); }
    catch (e) { $('#pickHint').hidden = false; $('#srcPick').click(); }
  };
  $('#srcPick').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { buildFile(rd.result); $('#pickHint').hidden = true; } catch (err) { toast('ده مش ملف النظام', true); } e.target.value = ''; };
    rd.readAsText(f);
  };

  async function loadStaff() {
    try {
      const me = await DB.currentEmail(), list = await DB.listStaff();
      $('#staffList').innerHTML = list.map(r => `<div class="staff-row"><span dir="ltr"><b>${esc(emailToUser(r.email))}</b></span>${r.email === me
        ? `<span class="muted sm">إنت · ${ROLE_NAME[r.role] || r.role}</span>`
        : `<span class="acts"><select data-role="${esc(r.email)}">${Object.entries(ROLE_NAME).map(([k, v]) => `<option value="${k}" ${k === r.role ? 'selected' : ''}>${v}</option>`).join('')}</select>
           <button class="btn ghost sm danger-t" data-rm="${esc(r.email)}">إزالة</button></span>`}</div>`).join('');
    } catch (e) { $('#staffList').innerHTML = `<p class="err">${esc(dbErr(e))}</p>`; }
  }
  $('#staffList').onclick = async e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    if (!confirm(`إزالة ${emailToUser(b.dataset.rm)}؟ مش هيقدر يدخل الشاشة تاني.`)) return;
    try { await DB.removeStaff(b.dataset.rm); loadStaff(); } catch (err) { alert(dbErr(err)); }
  };
  $('#staffList').onchange = async e => {
    const sel = e.target.closest('[data-role]'); if (!sel) return;
    try { await DB.setStaffRole(sel.dataset.role, sel.value); toast('اتغيّرت الصلاحية ✓'); } catch (err) { alert(dbErr(err)); loadStaff(); }
  };
  $('#staffForm').onsubmit = async e => {
    e.preventDefault(); $('#staffErr').textContent = '';
    const u = $('#stUser').value.trim().toLowerCase(), p = $('#stPw').value, role = $('#stRole').value;
    if (!validLogin(u)) return ($('#staffErr').textContent = 'اسم المستخدم بالإنجليزي والأرقام بس (3 حروف على الأقل)');
    if (p.length < 6) return ($('#staffErr').textContent = 'الباسورد 6 حروف على الأقل');
    try { await DB.createStaff(u, p, role); $('#staffForm').reset(); toast(`اتضاف ✓ — ${u} (${ROLE_NAME[role]})`); loadStaff(); }
    catch (err) { $('#staffErr').textContent = 'مقدرناش نضيفه: ' + dbErr(err); }
  };

  /* ----- التقارير ----- */
  let repData = { items: [], daily: [], from: null, to: null };
  const dstr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const parseD = v => { const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d); };
  function setPeriod(p) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    let a = new Date(t), b = new Date(t);
    if (p === 'yesterday') { a.setDate(a.getDate() - 1); b = new Date(a); }
    else if (p === 'week') a.setDate(a.getDate() - 6);
    else if (p === 'month') a = new Date(t.getFullYear(), t.getMonth(), 1);
    else if (p === 'lastmonth') { a = new Date(t.getFullYear(), t.getMonth() - 1, 1); b = new Date(t.getFullYear(), t.getMonth(), 0); }
    $('#repFrom').value = dstr(a); $('#repTo').value = dstr(b);
    $$('#repPeriods .chip').forEach(c => c.classList.toggle('on', c.dataset.p === p));
    loadReport();
  }
  function initReports() { setPeriod('today'); }
  $('#repPeriods').onclick = e => { const b = e.target.closest('[data-p]'); if (b) setPeriod(b.dataset.p); };
  $('#repGo').onclick = () => { $$('#repPeriods .chip').forEach(c => c.classList.remove('on')); loadReport(); };
  async function loadReport() {
    if (!$('#repFrom').value || !$('#repTo').value) return;
    let from = parseD($('#repFrom').value), to = parseD($('#repTo').value);
    if (to < from) [from, to] = [to, from];
    const toEx = new Date(to); toEx.setDate(toEx.getDate() + 1);
    $('#repItems').innerHTML = '<tr><td colspan="6" class="muted center">بنحسب…</td></tr>';
    try {
      const [items, daily] = await Promise.all([DB.salesItems(from, toEx), DB.salesDaily(from, toEx)]);
      repData = { items, daily, from, to };
      renderReport();
    } catch (e) { console.error(e); $('#repItems').innerHTML = `<tr><td colspan="6" class="err">${esc(dbErr(e))}</td></tr>`; }
  }
  const fmtD = d => d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });
  function bars(rows, lbl, val, fmt) {
    const max = Math.max(1, ...rows.map(val));
    return rows.map(r => `<div class="bar-row"><span>${lbl(r)}</span><div class="bar-track"><div class="bar-fill" style="width:${(val(r) / max * 100).toFixed(1)}%"></div></div><b>${fmt(r)}</b></div>`).join('');
  }
  function renderReport() {
    const { items, daily, from, to } = repData;
    const revenue = daily.reduce((a, d) => a + d.revenue, 0), ordersN = daily.reduce((a, d) => a + d.orders, 0);
    const pieces = items.reduce((a, i) => a + i.qty, 0), itemsRev = items.reduce((a, i) => a + i.revenue, 0);
    $('#repTitle').textContent = `تقرير مبيعات ${S.cafe_name} — من ${fmtD(from)} لحد ${fmtD(to)}`;
    const top = items.slice().sort((a, b) => b.qty - a.qty)[0];
    $('#repStats').innerHTML = `
      <div class="stat"><small>المبيعات</small><b>${money(revenue)}</b></div>
      <div class="stat"><small>عدد الطلبات</small><b>${ordersN}</b></div>
      <div class="stat"><small>متوسط الطلب</small><b>${ordersN ? money(revenue / ordersN) : '—'}</b></div>
      <div class="stat"><small>قطع اتباعت</small><b>${pieces}</b></div>
      <div class="stat"><small>الأكتر طلباً</small><b style="font-size:17px">${top ? esc(top.name) + ` (${top.qty})` : '—'}</b></div>`;
    $('#repDaily').innerHTML = daily.length
      ? bars(daily, d => parseD(d.day).toLocaleDateString('ar-EG', { weekday: 'short', day: 'numeric', month: 'numeric' }), d => d.revenue, d => `${money(d.revenue)} <span class="muted sm">(${d.orders})</span>`)
      : '<p class="muted">مفيش مبيعات في الفترة دي.</p>';
    const cm = new Map(); items.forEach(i => { const x = cm.get(i.category) || { name: i.category, qty: 0, revenue: 0 }; x.qty += i.qty; x.revenue += i.revenue; cm.set(i.category, x); });
    const cats = [...cm.values()].sort((a, b) => b.revenue - a.revenue);
    $('#repCats').innerHTML = cats.length ? bars(cats, c => esc(c.name), c => c.revenue, c => `${money(c.revenue)} <span class="muted sm">(${c.qty})</span>`) : '<p class="muted">—</p>';
    renderRepItems(itemsRev);
    // أصناف متاحة ما اتباعتش خالص
    const sold = new Set(items.map(i => i.name));
    const zero = menu.filter(m => m.kind !== 'offer' && m.available && !sold.has(m.name));
    $('#repZero').innerHTML = items.length && zero.length ? `<details><summary class="muted sm">أصناف ما اتباعتش خالص في الفترة دي (${zero.length})</summary><p class="sm">${zero.map(m => esc(m.name)).join('، ')}</p></details>` : '';
  }
  function repRows() {
    const q = $('#repSearch').value.trim(), sort = $('#repSort').value;
    const rows = repData.items.filter(i => !q || i.name.includes(q) || i.category.includes(q));
    return rows.sort(sort === 'qty' ? (a, b) => b.qty - a.qty : sort === 'low' ? (a, b) => a.qty - b.qty || a.revenue - b.revenue : (a, b) => b.revenue - a.revenue);
  }
  function renderRepItems(total) {
    total = total ?? repData.items.reduce((a, i) => a + i.revenue, 0);
    const rows = repRows();
    $('#repItems').innerHTML = rows.map((i, n) => `<tr><td class="muted">${n + 1}</td><td><b>${esc(i.name)}</b></td><td class="muted">${esc(i.category)}</td>
      <td class="num">${i.qty}</td><td class="num">${money(i.revenue)}</td><td><span class="pct">${total ? (i.revenue / total * 100).toFixed(1) : 0}%</span></td></tr>`).join('')
      || '<tr><td colspan="6" class="muted center">مفيش مبيعات في الفترة دي</td></tr>';
  }
  $('#repSearch').oninput = () => renderRepItems();
  $('#repSort').onchange = () => renderRepItems();
  $('#repPrint').onclick = () => window.print();
  $('#repCsv').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const total = repData.items.reduce((a, i) => a + i.revenue, 0);
    const rows = [['الصنف', 'القسم', 'الكمية', 'المبيعات', 'النسبة %']].concat(repRows().map(i => [i.name, i.category, i.qty, i.revenue, total ? (i.revenue / total * 100).toFixed(1) : 0]));
    const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `tea-time-sales-${$('#repFrom').value}_${$('#repTo').value}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  };

  /* ----- التابات ----- */
  $$('.tabs button').forEach(b => b.onclick = () => {
    $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $$('.tab').forEach(t => t.hidden = t.id !== 'tab-' + b.dataset.tab);
    if (b.dataset.tab === 'customers') loadCustomers();
    if (b.dataset.tab === 'reports') loadReport();
  });

  (async function boot() {
    applyName(); document.title = baseTitle();
    $('#demoLink').href = siteBase() + '?t=1';
    if (!CONN && localStorage.getItem(LS_DEMO) !== '1') return showSetup(false);
    if (DEMO) { $('#demoBanner').hidden = false; return start(); }
    if (!DB) { view('login'); $('#loginErr').textContent = 'مكتبة Supabase متحملتش — اتأكد من النت وحدّث الصفحة.'; return; }
    try { S = { ...S, ...(await DB.getSettings()) }; applyName(); } catch (e) {}
    const u = await DB.getUser().catch(() => null);
    if (u) start(); else view('login');
  })();
}

IS_CUSTOMER ? customerApp() : cashierApp();
</script>
</body>
</html>
